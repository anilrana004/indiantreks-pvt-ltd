# Prefer monorepo-root railway.toml + Dockerfile.api (service root = repo root).
# This file is fallback only if a service root is apps/api (not recommended).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
